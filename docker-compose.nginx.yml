# Untuk server yang sudah punya nginx di port 80/443 (tanpa Caddy).
# Aplikasi hanya mendengar di 127.0.0.1:${APP_PORT}; nginx yang meneruskan dari domain.
#   docker compose -f docker-compose.nginx.yml up -d --build
services:
  app:
    build: .
    container_name: agent-desk
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/storage/office.db
    volumes:
      - agent-desk-data:/app/storage
    ports:
      - "127.0.0.1:${APP_PORT:-3500}:3000"

volumes:
  agent-desk-data:
